<title>Overture Content Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,500;0,600;1,400&display=swap">
<style>
:root {
  --bg: #ECEEEA; --surface: #FFFFFF; --surface-2: #F4F5F2; --ink: #1B211F; --muted: #5C6561;
  --line: #D4D8D3; --accent: #8A5A12; --accent-ink: #FFFFFF; --accent-soft: #F2E5CC;
  --good: #2C7249; --good-soft: #DDEFE3; --warn: #9A5B00; --warn-soft: #FBEBCF;
  --bad: #A83E2B; --bad-soft: #F7DDD7; --info: #2F5E86; --info-soft: #DCE8F3;
  --display: "Spectral", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #101413; --surface: #181D1B; --surface-2: #202624; --ink: #E6E9E4; --muted: #99A29E;
    --line: #2D3431; --accent: #D9A44E; --accent-ink: #1A1408; --accent-soft: #3A2F1C;
    --good: #72C392; --good-soft: #1C3326; --warn: #E3B061; --warn-soft: #3A2D16;
    --bad: #E58570; --bad-soft: #3D211B; --info: #86B6DE; --info-soft: #1B2B39;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101413; --surface: #181D1B; --surface-2: #202624; --ink: #E6E9E4; --muted: #99A29E;
  --line: #2D3431; --accent: #D9A44E; --accent-ink: #1A1408; --accent-soft: #3A2F1C;
  --good: #72C392; --good-soft: #1C3326; --warn: #E3B061; --warn-soft: #3A2D16;
  --bad: #E58570; --bad-soft: #3D211B; --info: #86B6DE; --info-soft: #1B2B39;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.masthead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; margin-bottom: 20px; }
.masthead h1 { font: 600 28px/1.1 var(--display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.masthead .meta { color: var(--muted); font-size: 13px; }
.masthead .meta b { color: var(--ink); font-weight: 500; }

/* Pipeline tabs: the stages a post moves through */
.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--line); margin-bottom: 20px; }
.pipeline button { border: 0; background: var(--surface); padding: 12px 14px; text-align: left; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.pipeline .step { font: 500 11px/1 var(--mono); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.pipeline .label { font-weight: 600; font-size: 15px; }
.pipeline .count { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.pipeline button[aria-selected="true"] { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }
.pipeline button[aria-selected="true"] .step { color: var(--accent); }
@media (max-width: 560px) {
  .pipeline { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pipeline button { padding: 10px; }
}

.notice { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: var(--muted); }
.notice.warn { background: var(--warn-soft); border-color: transparent; color: var(--ink); }
.notice.bad { background: var(--bad-soft); border-color: transparent; color: var(--ink); }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.search { flex: 1 1 240px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
select.status-filter { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.chip .n { font: 12px var(--mono); color: var(--muted); margin-left: 4px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: 0.7; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.views { display: grid; gap: 4px; margin-top: 4px; }
.views-note { font-size: 12px; } .views-note.bad { color: var(--bad); } .views-note a { color: var(--accent); }
.caption-create { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.caption-create .rstate { text-align: left; max-width: none; }
.btn.danger { color: var(--bad); }
.btn.danger:hover:not(:disabled) { border-color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.link { border: 0; background: none; padding: 4px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* Hook library */
.hook-list { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.hook { background: var(--surface); padding: 14px 16px; display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 16px; }
.hook > :not(.hthumb-col):not(.side) { grid-column: 2; }
.hthumb-col { grid-column: 1; grid-row: 1 / span 4; display: grid; gap: 4px; align-content: start; justify-items: center; }
.hthumb { width: 64px; aspect-ratio: 3 / 4; }
.hthumb.empty { font-size: 9px; }
.postlink { font-size: 11px; color: var(--accent); }
.hook .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.hook .pair.single { grid-template-columns: minmax(0, 1fr); }
.hook .version { display: grid; gap: 3px; align-content: start; padding-left: 10px; border-left: 2px solid var(--line); }
.hook .version.edited { border-left-color: var(--accent); }
.hook .pair.single .version { border-left: 0; padding-left: 0; }
.hook .vlabel { font: 500 11px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.hook .version.edited .vlabel { color: var(--accent); }
.hook .pair.single .version .vlabel { color: var(--muted); }
.hook .vtext { font: 500 17px/1.35 var(--display); margin: 0; overflow-wrap: anywhere; }
.hook .version.original .vtext { color: var(--muted); font-weight: 400; }
@media (max-width: 700px) { .hook .pair { grid-template-columns: minmax(0, 1fr); } }
.hook .adapted { color: var(--muted); font-size: 13px; }
.hook .adapted i { font-family: var(--display); }
.compare { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 6px; max-width: 560px; }
.cmp { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.cmp.ours { background: var(--accent-soft); }
.cmp-h { font: 500 11px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.cmp.ours .cmp-h { color: var(--accent); }
.cmp-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; overflow-wrap: anywhere; }
.cmp-label a { color: inherit; }
.cmp dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; font-size: 13px; }
.cmp dt { color: var(--muted); }
.cmp dd { margin: 0; text-align: right; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.cmp .rate { color: var(--muted); font-weight: 400; font-size: 11px; }
.cmp-empty { font-size: 12px; color: var(--muted); padding-block: 8px; }
.cmp-gap { font: 12px var(--mono); color: var(--muted); margin-top: 4px; }
.hook .evidence { font: 12px/1.4 var(--mono); color: var(--ink); }
.hook .note { color: var(--muted); font-size: 13px; }
.hook .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; grid-row: 1 / span 4; grid-column: 3; }
.hook .id { font: 11px var(--mono); color: var(--muted); }
@media (max-width: 560px) { .hook { grid-template-columns: 56px minmax(0, 1fr); } .hthumb { width: 56px; } .hook .side { grid-row: auto; grid-column: 2; flex-direction: row; align-items: center; } }

.pill { display: inline-block; font: 500 11px/1 var(--mono); padding: 4px 7px; border-radius: 4px; letter-spacing: 0.03em; text-transform: uppercase; white-space: nowrap; }
.pill.proven { background: var(--good-soft); color: var(--good); }
.pill.test-first { background: var(--accent-soft); color: var(--accent); }
.pill.draft, .pill.backlog { background: var(--surface-2); color: var(--muted); }
.pill.flagged { background: var(--bad-soft); color: var(--bad); }
.pill.new { background: var(--info-soft); color: var(--info); }
.cat { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }

.add-form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; display: grid; gap: 12px; }
.add-form .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); width: 100%; }
.field textarea { resize: vertical; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* Idea + review cards */
.day { margin: 22px 0 10px; display: flex; align-items: baseline; gap: 10px; }
.day h2 { font: 600 19px var(--display); margin: 0; }
.day .sub { font: 12px var(--mono); color: var(--muted); }
.cards { display: grid; gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; grid-template-columns: 76px auto minmax(0, 1fr) auto; gap: 14px; align-items: start; }
.card .when { display: grid; gap: 6px; }
.card .time { font: 500 18px var(--mono); font-variant-numeric: tabular-nums; }
.card .persona { font-size: 12px; color: var(--muted); line-height: 1.3; }
.thumbs { display: flex; gap: 6px; }
.thumb { width: 64px; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); padding: 0; cursor: zoom-in; background: var(--surface-2); position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .num { position: absolute; left: 4px; bottom: 4px; font: 500 10px var(--mono); background: rgba(0,0,0,0.6); color: #fff; padding: 1px 4px; border-radius: 3px; }
.thumb.empty { cursor: default; display: grid; place-items: center; font: 10px/1.2 var(--mono); color: var(--muted); text-align: center; padding: 4px; border-style: dashed; }
.body { display: grid; gap: 6px; min-width: 0; }
.hookline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.hookline .ref { font-family: var(--display); font-style: italic; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; overflow-wrap: anywhere; }
.hookline .ref:hover { text-decoration-color: var(--accent); }
.cover { font: 600 17px/1.3 var(--display); margin: 0; overflow-wrap: anywhere; }
.titleline { font-size: 13px; }
.titleline .k { color: var(--muted); }
.captionprev { color: var(--muted); font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; white-space: pre-line; }
.blocker { font-size: 12px; color: var(--warn); background: var(--warn-soft); padding: 4px 8px; border-radius: 6px; justify-self: start; }
.actions { display: grid; gap: 6px; justify-items: end; }
@media (max-width: 760px) {
  .card { grid-template-columns: 64px minmax(0, 1fr); }
  .card .thumbs { grid-column: 2; grid-row: 1; }
  .card .body { grid-column: 1 / -1; }
  .card .actions { grid-column: 1 / -1; justify-items: stretch; }
}

.card.idea { grid-template-columns: 76px minmax(0, 1fr) auto; }
.pair-blocks { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px; }
.side-block { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.ours-block { background: var(--accent-soft); }
.ours-block .cmp-h { color: var(--accent); }
.side-row { display: flex; gap: 10px; align-items: flex-start; }
.side-text { display: grid; gap: 4px; min-width: 0; }
/* Slide 1 of the original and of our proposal carry the row: large and side by side */
.side-row > .thumb, .side-row .thumbs .thumb:first-child { width: 132px; flex: none; }
.side-row .thumbs { align-items: flex-end; flex: none; }
.side-row .thumbs .thumb:not(:first-child) { width: 44px; }
.ref-id { font: 500 11px var(--mono); color: var(--muted); letter-spacing: 0.02em; text-transform: none; }
.cmp-h .ref-id { margin-left: 6px; }
.hookline .ref-id { color: inherit; }
.style-line { font-size: 12px; color: var(--ink); }
.style-line .k { color: var(--muted); }
.style-line.missing { color: var(--warn); }
.stepper { display: grid; gap: 4px; justify-items: center; flex: none; }
.thumb.big { width: 132px; }
.thumb.empty.big { aspect-ratio: 2 / 3; }
.step-nav { display: flex; align-items: center; gap: 6px; }
button.step { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 30px; height: 26px; cursor: pointer; font: 600 14px var(--mono); }
button.step:disabled { opacity: 0.35; cursor: default; }
.step-n { font: 12px var(--mono); color: var(--muted); min-width: 34px; text-align: center; }
@media (max-width: 560px) { .thumb.big { width: 104px; } }
@media (max-width: 560px) { .side-row > .thumb, .side-row .thumbs .thumb:first-child { width: 104px; } }
.side-block .cover { font-size: 15px; }
.icon-btn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 4px; vertical-align: middle; line-height: 0; }
.icon-btn:hover:not(:disabled) { color: var(--accent); background: var(--surface); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.lock-note { font: 500 10px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); margin-left: 4px; vertical-align: middle; }
.edit-row { display: grid; gap: 4px; font-size: 12px; }
.edit-input { width: 100%; border: 1px solid var(--accent); border-radius: 6px; padding: 6px 8px; background: var(--surface); font: 14px/1.4 var(--sans); resize: vertical; }
.edit-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.edit-actions .btn { padding: 4px 12px; font-size: 12px; }
.pin { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; }
.pin-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 500 11px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.pin ul { margin: 0; padding-left: 18px; font-size: 13px; }
.pin .btn { padding: 4px 10px; font-size: 12px; }
.pin ol { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 6px; }
.pin ol li > div { display: flex; gap: 8px; justify-content: space-between; align-items: start; }
.pin ol .t { white-space: pre-line; }

/* Slide = text-free photo + the text drawn on top (the text is added natively in TikTok, never baked in) */
.sl { position: relative; display: block; width: 100%; height: 100%; container-type: inline-size; overflow: hidden; }
.sl img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ov { position: absolute; left: 50%; transform: translate(-50%, -50%); text-align: center; white-space: pre-line; color: #fff; pointer-events: none; overflow-wrap: break-word; }
.ov.serif, .ov.serif-bold { font-family: Georgia, "Times New Roman", serif; text-shadow: 0 0.4cqw 2cqw rgba(0,0,0,.75); }
.ov.serif-bold { font-weight: 700; }
.ov.tiktok { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 700; text-shadow: 0 0.5cqw 2.4cqw rgba(0,0,0,.75); }
.ov.outline { font-family: Arial, sans-serif; font-weight: 700; -webkit-text-stroke: 1.4cqw rgba(0,0,0,.85); paint-order: stroke fill; }
.ov-card { position: absolute; left: 0; right: 0; bottom: 0; background: #F6EEDF; color: #3B2A1A; padding: 4cqw 7cqw; text-align: center; font: italic 4.2cqw/1.3 Georgia, serif; }
.ov-card .b { font-style: normal; font-size: 3.2cqw; color: #6B5840; margin-top: 2cqw; }
.lb-frame { height: min(calc(100vh - 120px), calc((100vw - 32px) * 1.5)); aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.lightbox .sl img { max-height: none; border-radius: 0; box-shadow: none; }
.mini { display: grid; grid-template-columns: repeat(5, auto); gap: 0 10px; margin: 0; font-size: 11px; }
.mini dt { color: var(--muted); grid-row: 1; }
.mini dd { margin: 0; grid-row: 2; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .card.idea { grid-template-columns: minmax(0, 1fr); } .pair-blocks { grid-template-columns: minmax(0, 1fr); } .card.idea .actions { justify-items: stretch; } }
.review .body { gap: 10px; }
.review textarea.caption { min-height: 260px; font: 13px/1.55 var(--sans); }
.review .charcount { font: 12px var(--mono); color: var(--muted); text-align: right; }
.review .charcount.over { color: var(--bad); }
.schedule-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.result { font-size: 13px; }
.result.bad { color: var(--bad); }
.result.good { color: var(--good); }

.sched-state { font: 500 12px var(--mono); }
.rstate { font-size: 12px; color: var(--muted); text-align: right; max-width: 180px; }
.rstate.good { color: var(--good); } .rstate.bad { color: var(--bad); }
.steps { list-style: none; margin: 2px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.steps li { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.steps li.done { color: var(--good); }
.steps li.now { color: var(--ink); font-weight: 500; }
.steps li.fail { color: var(--bad); font-weight: 500; }
.steps .dot { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; font: 700 10px/1 var(--sans); opacity: .9; }
.steps li.todo .dot { opacity: .45; }
.steps li.now .dot { border-color: var(--accent); border-right-color: transparent; }
@media (prefers-reduced-motion: no-preference) { .steps li.now .dot { animation: spin .9s linear infinite; } }
@keyframes spin { to { transform: rotate(360deg); } }
.k { color: var(--muted); }
.empty-state { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--muted); }

/* Lightbox */
.lightbox { position: fixed; inset: 0; background: rgba(8, 10, 9, 0.88); display: grid; place-items: center; z-index: 10; padding: 24px 16px; }
.lightbox figure { margin: 0; display: grid; gap: 10px; justify-items: center; max-height: 100%; }
.lightbox img { max-height: calc(100vh - 120px); max-width: 100%; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.lightbox figcaption { color: #E6E9E4; font: 13px var(--mono); display: flex; gap: 16px; align-items: center; }
.lightbox button { background: rgba(255,255,255,0.12); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
/* TikTok preview: 9:16 phone frame, photo-mode layout */
.tt-wrap { position: fixed; inset: 0; background: rgba(8, 10, 9, 0.88); display: grid; place-items: center; z-index: 12; padding: 16px; }
.tt-col { display: grid; gap: 10px; justify-items: center; }
.tt-phone { position: relative; height: min(84vh, 760px); aspect-ratio: 9 / 16; max-width: calc(100vw - 32px); background: #000; border-radius: 28px; overflow: hidden; box-shadow: 0 0 0 6px #1c1c1c, 0 20px 60px rgba(0,0,0,.6); color: #fff; font: 13px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; container-type: inline-size; }
.tt-top { position: absolute; top: 0; left: 0; right: 0; padding: 4.5cqw 4cqw 0; display: flex; justify-content: center; gap: 5cqw; font-size: 4.2cqw; font-weight: 600; color: rgba(255,255,255,.6); z-index: 2; }
.tt-top b { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 1cqw; }
.tt-media { position: absolute; top: 13cqw; left: 0; right: 0; aspect-ratio: 2 / 3; background: #000; }
.tt-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tt-nav { position: absolute; top: 0; bottom: 0; width: 35%; background: none; border: 0; cursor: pointer; }
.tt-nav.prev { left: 0; } .tt-nav.next { right: 0; }
.tt-count { position: absolute; top: 3cqw; right: 3cqw; background: rgba(0,0,0,.45); border-radius: 999px; padding: .6cqw 2.2cqw; font-size: 3.2cqw; }
.tt-dots { position: absolute; bottom: 2.5cqw; left: 0; right: 0; display: flex; justify-content: center; gap: 1.4cqw; }
.tt-dots i { width: 1.6cqw; height: 1.6cqw; border-radius: 50%; background: rgba(255,255,255,.45); }
.tt-dots i.on { background: #fff; }
.tt-rail { position: absolute; right: 2.5cqw; bottom: 26cqw; display: grid; gap: 4.5cqw; justify-items: center; font-size: 3cqw; font-weight: 600; z-index: 2; }
.tt-rail span { display: grid; justify-items: center; gap: .6cqw; }
.tt-rail svg { width: 8.5cqw; height: 8.5cqw; fill: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
.tt-avatar { width: 11cqw; height: 11cqw; border-radius: 50%; background: #444 center/cover; border: 2px solid #fff; }
.tt-info { position: absolute; left: 0; right: 16cqw; bottom: 12cqw; padding: 0 3.5cqw; display: grid; gap: 1.4cqw; font-size: 3.6cqw; }
.tt-user { font-weight: 700; font-size: 4cqw; }
.tt-title { font-weight: 600; }
.tt-cap { white-space: pre-line; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: rgba(255,255,255,.92); }
.tt-cap.open { display: block; max-height: 60cqw; overflow-y: auto; }
.tt-more { background: none; border: 0; color: rgba(255,255,255,.7); font: inherit; font-weight: 600; padding: 0; cursor: pointer; justify-self: start; }
.tt-sound { font-size: 3.3cqw; color: rgba(255,255,255,.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10cqw; background: #000; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; font-size: 2.8cqw; color: rgba(255,255,255,.75); }
.tt-bar .plus { width: 9cqw; height: 6cqw; border-radius: 1.6cqw; background: #fff; color: #000; display: grid; place-items: center; font-weight: 700; font-size: 4.5cqw; box-shadow: -1cqw 0 0 #25f4ee, 1cqw 0 0 #fe2c55; }
.tt-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; align-items: center; color: #E6E9E4; font: 13px var(--mono); }
.tt-controls button { background: rgba(255,255,255,0.12); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.tt-controls button:disabled { opacity: .35; cursor: default; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 11; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .card, .hook { transition: background-color .15s; } }
</style>

<div class="wrap">
  <header class="masthead">
    <h1>Overture Content Engine</h1>
    <div class="meta"><b>Overture</b> · ICP and jobs to be done not set yet · 3 posts a day</div>
  </header>

  <nav class="pipeline" role="tablist" aria-label="Pipeline">
    <button role="tab" data-view="hooks" id="tab-hooks"><span class="step">Library</span><span class="label">Hooks</span><span class="count" data-count="hooks">–</span></button>
    <button role="tab" data-view="ideas" id="tab-ideas"><span class="step">Step 1</span><span class="label">Ideas</span><span class="count" data-count="ideas">–</span></button>
    <button role="tab" data-view="review" id="tab-review"><span class="step">Step 2</span><span class="label">Review</span><span class="count" data-count="review">–</span></button>
    <button role="tab" data-view="scheduled" id="tab-scheduled"><span class="step">Step 3</span><span class="label">Scheduled</span><span class="count" data-count="scheduled">–</span></button>
    <button role="tab" data-view="posted" id="tab-posted"><span class="step">Done</span><span class="label">Posted</span><span class="count" data-count="posted">–</span></button>
  </nav>

  <div id="status" class="notice">Loading the hook library and week plan…</div>
  <main id="view"></main>
</div>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Slide preview">
  <figure>
    <div id="lb-media"></div>
    <figcaption><button id="lb-prev" type="button">← Prev</button><span id="lb-label"></span><button id="lb-next" type="button">Next →</button><button id="lb-close" type="button">Close</button></figcaption>
  </figure>
</div>
<div id="tt" class="tt-wrap" hidden role="dialog" aria-modal="true" aria-label="TikTok preview"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
  // Overture ICP: categories and personas are filled in once the ICP and jobs to be done are set.
  // Until then, categories come from the hooks in the library.
  const CATS = [];
  const STATUSES = ['proven', 'test-first', 'draft', 'backlog', 'flagged'];
  const PERSONA_CAT = {};
  const PERSONA_SHORT = { flex: 'Test slot' };
  const HANDLE = 'overture';

  const state = { view: 'ideas', hooks: [], posts: [], cat: 'All', status: 'all', platform: 'all', q: '', adding: false, canWrite: true, busy: {} };
  let db = null, comments = null;

  // Postiz TikTok channels an approved post can go to (one Approve 2 button each)
  // None yet: add Overture's Postiz TikTok channels here as { key, name, id, handle }
  const CHANNELS = [];
  // Retired channels: no Approve 2 button, but older posts sent there still show their channel and handle
  const OLD_CHANNELS = [];

  // Wake Claude's session from a button click: posts a short comment on the button and sends it to Claude.
  // Must start inside the click gesture. Resolves false (never throws) when it can't go through.
  async function pingClaude(el, text) {
    if (!comments) return false;
    try {
      if ((await comments.canSendToClaude()) !== 'available') return false;
      await comments.sendToClaude({ anchor: await comments.anchorFor(el), text });
      return true;
    } catch (e) { return false; }
  }

  try { const v = localStorage.getItem('oce-view'); if (v) state.view = v; const pf = localStorage.getItem('oce-platform'); if (pf) state.platform = pf; } catch (e) {}
  // Where a hook was found: its platform field, else read from the post link
  const PLATFORMS = ['TikTok', 'Instagram', 'Other'];
  const platOf = h => h.platform || (/tiktok\.com/.test(h.postUrl || '') ? 'TikTok' : /instagram\.com/.test(h.postUrl || '') ? 'Instagram' : 'Other');
  if (/^#(hooks|ideas|review|scheduled|posted)$/.test(location.hash)) state.view = location.hash.slice(1);

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hookById = id => state.hooks.find(h => h.id === id);
  const fmtDay = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const catOf = p => PERSONA_CAT[p.persona] || (hookById(p.hookId)?.category) || 'Flex';

  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3200); }
  function setStatus(msg, kind) { const s = $('#status'); if (!msg) { s.hidden = true; return; } s.hidden = false; s.className = 'notice' + (kind ? ' ' + kind : ''); s.textContent = msg; }

  // ── Tabs ─────────────────────────────────────────────────────────────
  document.querySelectorAll('.pipeline button').forEach(b => b.addEventListener('click', () => {
    state.view = b.dataset.view; try { localStorage.setItem('oce-view', state.view); } catch (e) {} render();
  }));

  function counts() {
    const by = s => state.posts.filter(p => p.stage === s).length;
    const c = { hooks: state.hooks.length, ideas: by('idea'), review: by('review'), scheduled: by('scheduled'), posted: by('posted') };
    document.querySelectorAll('[data-count]').forEach(el => (el.textContent = c[el.dataset.count] + (el.dataset.count === 'hooks' ? ' hooks' : ' posts')));
    document.querySelectorAll('.pipeline button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === state.view)));
  }

  function render() {
    counts();
    const v = $('#view');
    // A live update can re-render mid-edit: carry the half-typed headline/title across it
    const typing = v.querySelector('[data-edit-input]');
    const kept = typing && { value: typing.value, pos: typing.selectionStart, focused: document.activeElement === typing };
    queueMicrotask(() => { const el = kept && v.querySelector('[data-edit-input]'); if (el) { el.value = kept.value; if (kept.focused) { el.focus(); el.setSelectionRange(kept.pos, kept.pos); } } });
    if (state.view === 'hooks') v.innerHTML = renderHooks();
    else if (state.view === 'ideas') v.innerHTML = renderStage('idea');
    else if (state.view === 'review') v.innerHTML = renderStage('review');
    else if (state.view === 'posted') v.innerHTML = renderPosted();
    else v.innerHTML = renderScheduled();
  }

  // ── Hook library ─────────────────────────────────────────────────────
  function filteredHooks() {
    const q = state.q.trim().toLowerCase();
    return state.hooks
      .filter(h => state.cat === 'All' || h.category === state.cat)
      .filter(h => state.platform === 'all' || platOf(h) === state.platform)
      .filter(h => state.status === 'all' || h.status === state.status)
      .filter(h => !q || [h.text, h.sourceHook, h.evidence, h.note, h.id, h.ref].some(x => String(x || '').toLowerCase().includes(q)))
      .sort((a, b) => (STATUSES.indexOf(a.status) - STATUSES.indexOf(b.status)) || ((a.order ?? 1e9) - (b.order ?? 1e9)));
  }

  function renderHooks() {
    const cats = [...new Set([...CATS, ...state.hooks.map(h => h.category).filter(Boolean)])];
    const n = c => state.hooks.filter(h => (c === 'All' || h.category === c) && (state.platform === 'all' || platOf(h) === state.platform)).length;
    const plats = [...new Set(state.hooks.map(platOf))].sort((a, b) => PLATFORMS.indexOf(a) - PLATFORMS.indexOf(b));
    const np = p => state.hooks.filter(h => p === 'all' || platOf(h) === p).length;
    const list = filteredHooks();
    return `
      <div class="toolbar">
        <input class="search" id="hook-q" type="search" placeholder="Search hooks, sources, evidence…" value="${esc(state.q)}" aria-label="Search hooks">
        <select class="status-filter" id="hook-platform" aria-label="Filter by platform">
          <option value="all">All platforms (${np('all')})</option>
          ${plats.map(p => `<option value="${esc(p)}" ${state.platform === p ? 'selected' : ''}>${esc(p)} (${np(p)})</option>`).join('')}
        </select>
        <select class="status-filter" id="hook-status" aria-label="Filter by status">
          <option value="all">All statuses</option>
          ${STATUSES.map(s => `<option value="${s}" ${state.status === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
        <button class="btn primary" id="hook-add" type="button" ${state.canWrite ? '' : 'disabled'}>Add hook</button>
      </div>
      <div class="chips" role="group" aria-label="Filter by category">
        ${['All', ...cats].map(c => `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${state.cat === c}">${esc(c)}<span class="n">${n(c)}</span></button>`).join('')}
      </div>
      ${state.adding ? renderAddForm() : ''}
      ${list.length ? `<div class="hook-list">${list.map(renderHook).join('')}</div>` : `<div class="empty-state">${state.hooks.length ? 'No hooks match these filters.' : 'The Overture hook library is empty. Add a hook, or give Claude the ICP and jobs to be done to draft the first set.'}</div>`}`;
  }

  function renderHook(h) {
    const based = h.basedOn && hookById(h.basedOn);
    const pair = h.sourceHook
      ? `<div class="pair">
          <div class="version original"><span class="vlabel">Original hook</span><p class="vtext">${esc(h.sourceHook)}</p></div>
          <div class="version edited"><span class="vlabel">Edited hook</span><p class="vtext">${esc(h.text)}</p></div>
        </div>`
      : `<div class="pair single"><div class="version edited"><span class="vlabel">${h.source === 'Research' ? 'Original hook (proven as posted)' : 'Hook'}</span><p class="vtext">${esc(h.text)}</p></div></div>`;
    const shot = h.thumb
      ? `<div class="hthumb-col"><button type="button" class="thumb hthumb" data-hlb="${esc(h.id)}" aria-label="Open the original post's slide 1 larger"><img src="${esc(h.thumb)}" alt="Slide 1 of the original post" loading="lazy"></button>
         ${h.postUrl ? `<a class="postlink" href="${esc(h.postUrl)}" target="_blank" rel="noopener">Open post</a>` : ''}</div>`
      : `<div class="hthumb-col"><div class="thumb hthumb empty">No post image</div></div>`;
    return `<article class="hook" id="hook-${esc(h.id)}">
      ${shot}
      ${pair}
      <div class="side"><span class="pill ${esc(h.status)}">${esc(h.status)}</span><span class="cat">${esc(h.category)}</span><span class="ref-id">${esc(platOf(h))} · ${esc(h.ref || h.id)}</span>${h.status === 'backlog' || h.offerIdeas ? addToIdeasBtn(h) : ''}</div>
      ${based ? `<div class="adapted">Based on: <i>${esc(based.text)}</i></div>` : ''}
      ${compareBlock(h)}
      ${h.evidence ? `<div class="evidence">${esc(h.evidence)}</div>` : ''}
      ${h.note ? `<div class="note">${esc(h.note)}</div>` : ''}
    </article>`;
  }

  // Backlog hook -> new post in the Ideas tab, in the earliest free slot from today
  const CAT_PERSONA = {};
  const SLOTS = ['07:30', '16:30', '21:00'];
  function addToIdeasBtn(h) {
    const p = state.posts.find(x => x.hookId === h.id && x.stage !== 'posted');
    if (p) return `<span class="k" style="font-size:12px">In ${esc(p.stage === 'idea' ? 'Ideas' : p.stage)} as ${esc(p.ref || p.id)}</span>`;
    return `<button class="btn primary" type="button" data-add-idea="${esc(h.id)}" ${state.canWrite && !state.busy[h.id] ? '' : 'disabled'}>Add to Ideas</button>`;
  }
  function nextFreeSlot() {
    const taken = new Set(state.posts.map(p => p.id));
    const d = new Date(); d.setHours(12, 0, 0, 0);
    for (let i = 0; i < 366; i++, d.setDate(d.getDate() + 1)) {
      const date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      for (const time of SLOTS) { const id = `${date}-${time.replace(':', '')}`; if (!taken.has(id)) return { id, date, time, day: d.toLocaleDateString('en-GB', { weekday: 'short' }) }; }
    }
    return null;
  }
  async function addHookToIdeas(hookId) {
    const h = hookById(hookId); const slot = nextFreeSlot(); if (!h || !slot || !db) return;
    state.busy[hookId] = true; render();
    const num = state.posts.reduce((m, p) => Math.max(m, p.num || 0), 0) + 1;
    const ref = 'P-' + String(num).padStart(3, '0');
    try {
      await db.doc('posts/' + slot.id).set({ id: slot.id, date: slot.date, day: slot.day, time: slot.time, num, ref, hookId: h.id, newHook: null,
        persona: CAT_PERSONA[h.category] || h.category, cover: h.text, subject: '', notes: [h.evidence, h.note].filter(Boolean).join(' · '),
        stage: 'idea', blocker: 'Slides not built yet', caption: '', title: '', slides: [], postizMedia: [], pinterest: [], createdAt: new Date().toISOString() });
      toast(`${ref} added to Ideas for ${fmtDay(slot.date)} ${slot.time}`);
    } catch (e) { toast('Could not add: ' + (e?.message || e?.code)); }
    finally { delete state.busy[hookId]; render(); }
  }

  // "What's possible" (original post) vs "What we did" (our post), same rows so they read across
  const METRICS = [['views', 'Views'], ['likes', 'Likes'], ['saves', 'Saves'], ['shares', 'Shares'], ['comments', 'Comments']];
  const fmtN = n => n == null ? '—' : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'K' : String(n);
  function statCol(title, m, cls, emptyText) {
    if (!m) return `<div class="cmp ${cls} empty"><div class="cmp-h">${title}</div><div class="cmp-empty">${emptyText}</div></div>`;
    const rate = (k) => m.views && m[k] != null ? ` <span class="rate">${(m[k] / m.views * 100).toFixed(1)}%</span>` : '';
    return `<div class="cmp ${cls}"><div class="cmp-h">${title}</div>
      ${m.label ? `<div class="cmp-label">${m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.label)}</a>` : esc(m.label)}</div>` : ''}
      <dl>${METRICS.map(([k, l]) => `<dt>${l}</dt><dd>${fmtN(m[k])}${k === 'views' ? '' : rate(k)}</dd>`).join('')}</dl></div>`;
  }
  function compareBlock(h) {
    if (!h.orig && !h.ours) return '';
    const gap = h.orig?.views && h.ours?.views ? `<div class="cmp-gap">Ours reached ${(h.ours.views / h.orig.views * 100).toFixed(h.ours.views / h.orig.views < 0.01 ? 2 : 1)}% of the original's views</div>` : '';
    return `<div class="compare">${statCol("What's possible", h.orig, 'orig', 'No original post to compare')}${statCol('What we did', h.ours, 'ours', 'Not posted by us yet')}</div>${gap}`;
  }

  function renderAddForm() {
    const cats = [...new Set([...CATS, ...state.hooks.map(h => h.category).filter(Boolean)])];
    return `<form class="add-form" id="add-form">
      <div class="row">
        <div class="field"><label for="nh-source">Original hook (as you found it, optional)</label><textarea id="nh-source" rows="2"></textarea></div>
        <div class="field"><label for="nh-text">Edited hook (our version for slide 1)</label><textarea id="nh-text" rows="2" required></textarea></div>
      </div>
      <div class="row">
        <div class="field"><label for="nh-cat">Category</label><select id="nh-cat">${cats.map(c => `<option>${esc(c)}</option>`).join('')}<option value="__new" ${cats.length ? '' : 'selected'}>New category…</option></select></div>
        <div class="field"><label for="nh-newcat">New category name</label><input id="nh-newcat" placeholder="Only if you chose New category"></div>
        <div class="field"><label for="nh-status">Status</label><select id="nh-status">${STATUSES.map(s => `<option ${s === 'test-first' ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="row">
        <div class="field"><label for="nh-evidence">Evidence (views, saves, where you saw it)</label><input id="nh-evidence" placeholder="e.g. 210K views · @account"></div>
      </div>
      <div class="field"><label for="nh-note">Notes</label><input id="nh-note"></div>
      <div class="form-actions"><button class="btn" type="button" id="add-cancel">Cancel</button><button class="btn primary" type="submit">Save hook</button></div>
    </form>`;
  }

  // ── Ideas / Review ───────────────────────────────────────────────────
  function hookLine(p) {
    if (p.hookId && hookById(p.hookId)) {
      const h = hookById(p.hookId);
      const based = h.basedOn && hookById(h.basedOn);
      return `<div class="hookline"><span>Replicates ${esc(h.ref || "")}</span><button type="button" class="ref" data-goto-hook="${esc(h.ref || h.id)}">${esc(h.text)}</button><span class="pill ${esc(h.status)}">${esc(h.status)}</span>${based ? `<span>· based on the ${esc(based.evidence.split('·')[1]?.trim() || '')} breakout</span>` : ''}</div>`;
    }
    const n = p.newHook || {};
    const based = n.basedOn && hookById(n.basedOn);
    return `<div class="hookline"><span class="pill new">New hook</span><span>not in library${based ? `, uses the pattern of <button type="button" class="ref" data-goto-hook="${esc(based.id)}">${esc(based.text)}</button>` : ''}</span>
      <button type="button" class="btn link" data-add-new="${esc(p.id)}" ${state.canWrite ? '' : 'disabled'}>Add to library</button></div>`;
  }

  // Text layer for slide i, from the post's overlays (same presets as build-slides.js)
  const OV_WIDTH = { outline: 0.8, tiktok: 0.82, serif: 0.72, 'serif-bold': 0.8 };
  function overlay(p, i) {
    const o = p.overlays?.[i]; if (!o) return '';
    const st = OV_WIDTH[o.style] ? o.style : 'outline';
    const text = o.text ? `<div class="ov ${st}" style="top:${(o.y ?? 0.4) * 100}%;width:${(o.width || OV_WIDTH[st]) * 100}%;font-size:${(o.size || 0.065) * 100}cqw;line-height:${o.lineHeight || 1.25}">${esc(o.text)}</div>` : '';
    const card = o.card ? `<div class="ov-card" style="top:${o.card.top * 100}%">${esc(o.card.title || '')}${o.card.body ? `<div class="b">${esc(o.card.body)}</div>` : ''}</div>` : '';
    return card + text;
  }
  const slideImg = (p, i, alt, lazy) => `<span class="sl"><img src="${esc(p.slides[i])}" alt="${esc(alt)}"${lazy ? ' loading="lazy"' : ''}>${overlay(p, i)}</span>`;

  // The text to type onto each slide in the TikTok app, one Copy per slide
  function textBox(p) {
    if (!p.overlays?.some(o => o?.text)) return '';
    return `<div class="pin"><div class="pin-h"><span>Slide text to add in TikTok</span></div>
      <ol>${p.overlays.map((o, i) => o?.text ? `<li><div><span class="t">${esc(o.text)}</span><button type="button" class="btn" data-copy-text="${esc(p.id)}" data-i="${i}">Copy</button></div></li>` : '').join('')}</ol></div>`;
  }

  function thumbs(p) {
    if (!p.slides?.length) return `<div class="thumbs"><div class="thumb empty">Slides not built</div></div>`;
    return `<div class="thumbs">${p.slides.map((src, i) => `<button type="button" class="thumb" data-lb="${esc(p.id)}" data-i="${i}" aria-label="Open slide ${i + 1} larger">${slideImg(p, i, `Slide ${i + 1}`, true)}<span class="num">${i + 1}</span></button>`).join('')}</div>`;
  }

  // One large slide with < > to step through the proposed slides
  const slideIdx = {};
  function slideStepper(p) {
    if (!p.slides?.length) return `<div class="stepper"><div class="thumb empty big">Slides not built</div></div>`;
    const i = Math.min(slideIdx[p.id] || 0, p.slides.length - 1);
    return `<div class="stepper">
      <button type="button" class="thumb big" data-lb="${esc(p.id)}" data-i="${i}" aria-label="Open slide ${i + 1} larger">${slideImg(p, i, `Proposed slide ${i + 1}`)}</button>
      <div class="step-nav">
        <button type="button" class="step" data-step="${esc(p.id)}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Previous slide">&lt;</button>
        <span class="step-n">${i + 1} / ${p.slides.length}</span>
        <button type="button" class="step" data-step="${esc(p.id)}" data-dir="1" ${i === p.slides.length - 1 ? 'disabled' : ''} aria-label="Next slide">&gt;</button>
      </div></div>`;
  }

  function scheduleBlockers(p) {
    const out = [];
    if (p.blocker) out.push(p.blocker);
    if (!p.caption?.trim()) out.push('Full caption not written yet');
    if (!p.title?.trim()) out.push('TikTok title missing');
    return out;
  }

  function renderStage(stage) {
    const posts = state.posts.filter(p => p.stage === stage).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    if (!posts.length) {
      return `<div class="empty-state">${stage === 'idea' ? 'No ideas waiting. Approved ideas move to Review.' : 'Nothing to review. Use "Approve 1" on an idea to move it here.'}</div>`;
    }
    const days = [...new Set(posts.map(p => p.date))];
    return days.map(d => {
      const list = posts.filter(p => p.date === d);
      return `<section><div class="day"><h2>${fmtDay(d)}</h2><span class="sub">${list.length} post${list.length > 1 ? 's' : ''}</span></div>
        <div class="cards">${list.map(p => stage === 'idea' ? ideaCard(p) : reviewCard(p)).join('')}</div></section>`;
    }).join('');
  }

  // The hook this post copies: its own library entry, or the proven hook a new hook is patterned on
  function sourceHook(p) {
    const h = p.hookId && hookById(p.hookId);
    if (h && (h.thumb || h.orig)) return h;
    const b = (h?.basedOn && hookById(h.basedOn)) || (p.newHook?.basedOn && hookById(p.newHook.basedOn));
    return b || h || null;
  }

  // Pinterest search terms for sourcing a real photo like the original; one click copies them all
  function pinBox(p) {
    if (!p.pinterest?.length) return '';
    return `<div class="pin"><div class="pin-h"><span>Pinterest search terms</span><button type="button" class="btn" data-copy-pin="${esc(p.id)}">Copy</button></div>
      <ul>${p.pinterest.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return ok;
  }

  // Headline (slide-1 hook) and TikTok title, each with a pencil that swaps the text for an input.
  // Saving sets locked.<field> so Claude keeps the operator's wording when it writes or reimagines the caption.
  const PENCIL = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M3 17.2V21h3.8L17.9 9.9l-3.8-3.8L3 17.2zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.8 3.8L20.7 7z"/></svg>';
  function editable(p, field) {
    const isTitle = field === 'title';
    const label = isTitle ? 'TikTok title' : 'Headline';
    if (state.editing?.id === p.id && state.editing.field === field) {
      return `<div class="edit-row"><label class="k" for="e-${field}-${esc(p.id)}">${label}</label>
        <textarea id="e-${field}-${esc(p.id)}" class="edit-input" rows="2" ${isTitle ? 'maxlength="90"' : ''} data-edit-input="${esc(p.id)}" data-field="${field}">${esc(p[field] || '')}</textarea>
        <div class="edit-actions"><button type="button" class="btn primary" data-save-field="${esc(p.id)}" data-field="${field}">Save</button><button type="button" class="btn" data-cancel-field>Cancel</button>${isTitle ? '<span class="k">max 90 characters</span>' : ''}</div></div>`;
    }
    const lock = p.locked?.[field] ? '<span class="lock-note" title="Edited by you: Claude keeps this wording when writing the caption">edited</span>' : '';
    const pencil = `<button type="button" class="icon-btn" data-edit-field="${esc(p.id)}" data-field="${field}" aria-label="Edit ${label.toLowerCase()}" title="Edit ${label.toLowerCase()}" ${state.canWrite ? '' : 'disabled'}>${PENCIL}</button>`;
    return isTitle
      ? `<div class="titleline"><span class="k">Title:</span> ${p.title ? esc(p.title) : '<span class="k">not written yet</span>'} ${pencil}${lock}</div>`
      : `<p class="cover">${esc(p.cover)} ${pencil}${lock}</p>`;
  }

  async function saveField(id, field) {
    const p = state.posts.find(x => x.id === id); const el = view.querySelector(`[data-edit-input="${CSS.escape(id)}"][data-field="${field}"]`);
    if (!p || !el) return;
    const value = el.value.replace(/\s*\n\s*/g, ' ').trim();
    if (field === 'cover' && !value) { toast('The headline can\'t be empty'); return; }
    state.editing = null;
    if (value === (p[field] || '')) { render(); return; }
    const patch = { [field]: value, locked: { ...(p.locked || {}), [field]: true } };
    // The caption opens with the title line: keep the two in step
    if (field === 'title' && p.caption && p.title && p.caption.split('\n')[0].trim() === p.title.trim()) patch.caption = value + p.caption.slice(p.caption.indexOf('\n') === -1 ? p.caption.length : p.caption.indexOf('\n'));
    // Slide 1's on-image text follows the headline when it was just the headline re-wrapped
    if (field === 'cover' && p.overlays?.[0]?.text && p.overlays[0].text.replace(/\s+/g, ' ').trim() === (p.cover || '').replace(/\s+/g, ' ').trim()) patch.overlays = [{ ...p.overlays[0], text: value }, ...p.overlays.slice(1)];
    await patchPost(id, patch);
    toast(field === 'title' ? 'Title saved' : 'Headline saved');
  }

  function ideaCard(p) {
    const preview = p.caption ? p.caption : [p.subject, p.notes].filter(Boolean).join(' · ');
    const src = sourceHook(p);
    const origBlock = src
      ? `<section class="side-block orig-block"><div class="cmp-h">Original post <span class="ref-id">${esc(src.ref || src.id)}</span></div>
          <div class="side-row">${src.thumb ? `<button type="button" class="thumb" data-hlb="${esc(src.id)}" aria-label="Open original slide 1"><img src="${esc(src.thumb)}" alt="" loading="lazy"></button>` : `<div class="thumb empty">No image</div>`}
          <div class="side-text"><p class="cover">${esc(src.sourceHook || src.text)}</p>${src.orig?.label ? `<div class="cmp-label">${esc(src.orig.label)}</div>` : ''}</div></div>
          ${src.orig ? `<dl class="mini">${METRICS.map(([k, l]) => `<dt>${l}</dt><dd>${fmtN(src.orig[k])}</dd>`).join('')}</dl>` : `<div class="cmp-empty">No stats recorded for the original</div>`}
        </section>`
      : `<section class="side-block orig-block"><div class="cmp-h">Original post</div><div class="cmp-empty">New hook with no original to copy</div></section>`;
    return `<article class="card idea">
      <div class="when"><span class="time">${esc(p.time)}</span>${p.ref ? `<span class="ref-id">${esc(p.ref)}</span>` : ""}<span class="persona">${esc(PERSONA_SHORT[p.persona] || p.persona)}</span></div>
      <div class="pair-blocks">
        ${origBlock}
        <section class="side-block ours-block"><div class="cmp-h">Our proposal <span class="ref-id">${esc(p.ref || "")}</span></div>
          <div class="side-row">${slideStepper(p)}
          <div class="side-text">${editable(p, 'cover')}
            ${editable(p, 'title')}
            <div class="captionprev">${esc(preview)}</div>
            ${p.style ? `<div class="style-line"><span class="k">Style match:</span> ${esc([p.style.medium, p.style.palette, p.style.text].filter(Boolean).join(' · '))}</div>` : `<div class="style-line missing">No style brief yet: match the original's look, colour and text before building</div>`}
            ${textBox(p)}
            ${pinBox(p)}
            ${hookLine(p)}
            ${p.blocker ? `<span class="blocker">${esc(p.blocker)}</span>` : ''}</div></div>
        </section>
      </div>
      <div class="actions">
        <button class="btn primary" type="button" data-approve1="${esc(p.id)}" ${state.canWrite && !state.busy[p.id] ? '' : 'disabled'}>Approve 1</button>
        <button class="btn danger${state.rejectArm === p.id ? ' armed' : ''}" type="button" data-reject="${esc(p.id)}" ${state.canWrite && !state.busy[p.id] ? '' : 'disabled'} title="Removes this post from the week plan. Its hook stays in the library.">${state.rejectArm === p.id ? 'Confirm reject' : 'Reject'}</button>
        ${['slides', 'caption'].map(kind => {
          const r = p.reimagine?.[kind];
          const busy = r && (r.status === 'queued' || r.status === 'working');
          return `<button class="btn" type="button" data-reimagine="${kind}" data-id="${esc(p.id)}" ${state.canWrite && !busy ? '' : 'disabled'}>${busy ? 'Reimagining…' : kind === 'slides' ? 'Reimagine slides' : 'Reimagine caption'}</button>
            ${r ? `<span class="rstate ${r.status === 'error' ? 'bad' : r.status === 'done' ? 'good' : ''}">${esc(
              r.status === 'queued' ? 'Waiting for Claude…'
              : r.status === 'working' ? (r.detail || 'Claude is working on it…')
              : r.status === 'error' ? (r.error || 'Failed')
              : kind === 'slides' ? 'New composition ready' : 'New angle ready')}</span>` : ''}`;
        }).join('')}
      </div>
    </article>`;
  }

  // Shown while the caption or title is missing: asks Claude to write both (same flow as Reimagine caption)
  function captionBtn(p) {
    if (p.caption?.trim() && p.title?.trim()) return '';
    const r = p.reimagine?.caption;
    const busy = r && (r.status === 'queued' || r.status === 'working');
    const note = !r ? '' : r.status === 'queued' ? 'Waiting for Claude…' : r.status === 'working' ? (r.detail || 'Claude is writing it…') : r.status === 'error' ? (r.error || 'Failed') : '';
    return `<div class="caption-create"><button class="btn primary" type="button" data-create-caption="${esc(p.id)}" ${state.canWrite && !busy ? '' : 'disabled'}>${busy ? 'Writing caption…' : 'Create caption'}</button>${note ? `<span class="rstate ${r.status === 'error' ? 'bad' : ''}">${esc(note)}</span>` : ''}</div>`;
  }

  function reviewCard(p) {
    const blockers = scheduleBlockers(p);
    const len = [...(p.caption || '')].length;
    const at = p.scheduleAt || `${p.date}T${p.time}`;
    const res = p.lastError ? `<div class="result bad">${esc(p.lastError)}</div>` : '';
    return `<article class="card review">
      <div class="when"><span class="time">${esc(p.time)}</span>${p.ref ? `<span class="ref-id">${esc(p.ref)}</span>` : ""}<span class="persona">${esc(PERSONA_SHORT[p.persona] || p.persona)}</span></div>
      ${thumbs(p)}
      <div class="body">
        ${hookLine(p)}
        <p class="cover">${esc(p.cover)}</p>
        ${textBox(p)}
        ${pinBox(p)}
        <div class="field"><label for="t-${esc(p.id)}">TikTok title (first caption line, max 90)</label><input id="t-${esc(p.id)}" maxlength="90" data-edit-title="${esc(p.id)}" value="${esc(p.title)}" ${state.canWrite ? '' : 'readonly'}></div>
        <div class="field"><label for="c-${esc(p.id)}">Full caption</label><textarea class="caption" id="c-${esc(p.id)}" data-edit-caption="${esc(p.id)}" ${state.canWrite ? '' : 'readonly'} placeholder="Ask Claude to write this caption from the caption rules.">${esc(p.caption)}</textarea>
          <div class="charcount ${len >= 2200 ? 'over' : ''}" data-count-for="${esc(p.id)}">${len} / 2200</div></div>
        <div class="schedule-row">
          <div class="field"><label for="w-${esc(p.id)}">Send at (your local time)</label><input type="datetime-local" id="w-${esc(p.id)}" data-edit-when="${esc(p.id)}" value="${esc(at)}"></div>
        </div>
        <div class="note" style="font-size:12px;color:var(--muted)">Approve 2 sends the text-free photos through Telegram to compress them, uploads them to Postiz and schedules the post at this time on the TikTok channel you pick${CHANNELS.length ? ': ' + esc(CHANNELS.map(c => c.name).join(' or ')) : ' (no Overture channel is set up yet)'}. Progress shows in the Scheduled tab. Postiz puts the photos in your TikTok inbox as a draft, where you add each slide's text (listed above) and a sound, then publish.</div>
        ${blockers.length ? `<span class="blocker">${esc(blockers.join(' · '))}</span>` : ''}
        ${captionBtn(p)}
        ${res}
      </div>
      <div class="actions">
        ${CHANNELS.length ? '' : '<button class="btn primary" type="button" disabled title="Add an Overture TikTok channel to the engine first">Approve 2 – no channel yet</button>'}
        ${CHANNELS.map(c => `<button class="btn primary" type="button" data-approve2="${esc(p.id)}" data-channel="${c.key}" ${state.canWrite && !blockers.length && !state.busy[p.id] ? '' : 'disabled'}>${state.busy[p.id] ? 'Queuing…' : `Approve 2 – ${esc(c.name)}`}</button>`).join('')}
        <button class="btn link" type="button" data-back="${esc(p.id)}" ${state.canWrite ? '' : 'disabled'}>Back to ideas</button>
      </div>
    </article>`;
  }

  function renderScheduled() {
    const posts = state.posts.filter(p => p.stage === 'scheduled').sort((a, b) => String(a.schedule?.at).localeCompare(String(b.schedule?.at)));
    if (!posts.length) return `<div class="empty-state">Nothing scheduled yet. Posts land here after "Approve 2 – Schedule".</div>`;
    return `<div class="cards">${posts.map(p => {
      const s = p.schedule || {};
      const when = s.at ? new Date(s.at).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      return `<article class="card">
        <div class="when"><span class="time">${esc(p.time)}</span>${p.ref ? `<span class="ref-id">${esc(p.ref)}</span>` : ""}<span class="persona">${esc(PERSONA_SHORT[p.persona] || p.persona)}</span></div>
        ${thumbs(p)}
        <div class="body"><p class="cover">${esc(p.title || p.cover)}</p>
          <div class="sched-state">${esc(when)}</div>
          ${progress({ ...s, _id: p.id })}
        </div>
        <div class="actions"><button class="btn" type="button" data-tt="${esc(p.id)}">Preview on TikTok</button><button class="btn link" type="button" data-unqueue="${esc(p.id)}" ${state.canWrite ? '' : 'disabled'}>Back to review</button><button class="btn primary" type="button" data-posted="${esc(p.id)}" ${state.canWrite ? '' : 'disabled'}>Posted</button></div>
      </article>`;
    }).join('')}</div>`;
  }

  const chanOf = p => [...CHANNELS, ...OLD_CHANNELS].find(c => c.id === p.schedule?.integrationId || c.name === p.schedule?.channel) || null;
  // Views Claude read from the TikTok profile (p.stats), plus the state of a pending check
  function viewsBlock(p) {
    const st = p.stats; if (!st) return '';
    const fmt = d => new Date(d).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const hasNums = st.views != null;
    const nums = hasNums ? `<dl class="mini">${METRICS.map(([k, l]) => `<dt>${l}</dt><dd>${fmtN(st[k])}</dd>`).join('')}</dl>` : '';
    const line = st.status === 'queued' ? 'Waiting for Claude to check the channel…'
      : st.status === 'working' ? (st.detail || 'Claude is checking the channel…')
      : st.status === 'error' ? (st.error || 'Could not read the views')
      : st.checkedAt ? `Checked ${fmt(st.checkedAt)}${st.url ? ` · <a href="${esc(st.url)}" target="_blank" rel="noopener">open on TikTok</a>` : ''}` : '';
    return `<div class="views">${nums}${line ? `<div class="k views-note ${st.status === 'error' ? 'bad' : ''}">${st.status === 'done' ? line : esc(line)}</div>` : ''}</div>`;
  }

  // Posted: same layout as Scheduled, newest first
  function renderPosted() {
    const posts = state.posts.filter(p => p.stage === 'posted').sort((a, b) => String(b.postedAt || b.schedule?.at).localeCompare(String(a.postedAt || a.schedule?.at)));
    if (!posts.length) return `<div class="empty-state">Nothing posted yet. Press "Posted" on a scheduled post once it's live on TikTok.</div>`;
    return `<div class="cards">${posts.map(p => {
      const s = p.schedule || {};
      const fmt = d => new Date(d).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      return `<article class="card">
        <div class="when"><span class="time">${esc(p.time)}</span>${p.ref ? `<span class="ref-id">${esc(p.ref)}</span>` : ""}<span class="persona">${esc(PERSONA_SHORT[p.persona] || p.persona)}</span></div>
        ${thumbs(p)}
        <div class="body"><p class="cover">${esc(p.title || p.cover)}</p>
          <div class="sched-state">${p.postedAt ? `Marked posted ${esc(fmt(p.postedAt))}` : ''}${s.at ? ` · scheduled for ${esc(fmt(s.at))}` : ''}</div>
          <div class="result good">Posted${s.channel ? ` · ${esc(s.channel)}` : ''}${chanOf(p)?.handle ? ` (${esc(chanOf(p).handle)})` : ''}${s.previewUrl ? ` · <a href="${esc(s.previewUrl)}" target="_blank" rel="noopener">open in Postiz</a>` : ''}</div>
          ${viewsBlock(p)}
        </div>
        <div class="actions"><button class="btn primary" type="button" data-check-views="${esc(p.id)}" ${state.canWrite && !['queued', 'working'].includes(p.stats?.status) ? '' : 'disabled'}>${['queued', 'working'].includes(p.stats?.status) ? 'Checking views…' : 'Check views'}</button><button class="btn" type="button" data-tt="${esc(p.id)}">Preview on TikTok</button><button class="btn link" type="button" data-unpost="${esc(p.id)}" ${state.canWrite ? '' : 'disabled'}>Back to scheduled</button></div>
      </article>`;
    }).join('')}</div>`;
  }

  // ── Events ───────────────────────────────────────────────────────────
  const view = $('#view');
  view.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'hook-q') { state.q = t.value; const pos = t.selectionStart; render(); const n = $('#hook-q'); n.focus(); n.setSelectionRange(pos, pos); }
    if (t.dataset.editCaption) { const c = view.querySelector(`[data-count-for="${CSS.escape(t.dataset.editCaption)}"]`); const len = [...t.value].length; c.textContent = `${len} / 2200`; c.classList.toggle('over', len >= 2200); }
  });
  view.addEventListener('change', async e => {
    const t = e.target;
    if (t.id === 'hook-status') { state.status = t.value; render(); }
    if (t.id === 'hook-platform') { state.platform = t.value; try { localStorage.setItem('oce-platform', t.value); } catch (e) {} render(); }
    if (t.dataset.editCaption) await patchPost(t.dataset.editCaption, { caption: t.value });
    if (t.dataset.editTitle) await patchPost(t.dataset.editTitle, { title: t.value.trim() });
    if (t.dataset.editWhen) await patchPost(t.dataset.editWhen, { scheduleAt: t.value });
  });
  view.addEventListener('keydown', async e => {
    const t = e.target; if (!t.dataset?.editInput) return;
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); await saveField(t.dataset.editInput, t.dataset.field); }
    else if (e.key === 'Escape') { state.editing = null; render(); }
  });
  view.addEventListener('submit', async e => { if (e.target.id === 'add-form') { e.preventDefault(); await saveNewHook(); } });
  view.addEventListener('click', async e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.cat) { state.cat = t.dataset.cat; render(); }
    else if (t.id === 'hook-add') { state.adding = true; render(); $('#nh-text')?.focus(); }
    else if (t.id === 'add-cancel') { state.adding = false; render(); }
    else if (t.dataset.gotoHook) { state.view = 'hooks'; state.cat = 'All'; state.status = 'all'; state.platform = 'all'; state.q = t.dataset.gotoHook; render(); }
    else if (t.dataset.step) { const p = state.posts.find(x => x.id === t.dataset.step); slideIdx[p.id] = Math.max(0, Math.min(p.slides.length - 1, (slideIdx[p.id] || 0) + +t.dataset.dir)); render(); view.querySelector(`[data-step="${CSS.escape(p.id)}"][data-dir="${t.dataset.dir}"]`)?.focus(); }
    else if (t.dataset.copyText) { const p = state.posts.find(x => x.id === t.dataset.copyText); toast(await copyText(p.overlays[+t.dataset.i].text) ? `Slide ${+t.dataset.i + 1} text copied` : 'Could not copy: select the text and copy it by hand'); }
    else if (t.dataset.copyPin) { const p = state.posts.find(x => x.id === t.dataset.copyPin); toast(await copyText(p.pinterest.join('\n')) ? 'Pinterest search terms copied' : 'Could not copy: select the terms and copy them by hand'); }
    else if (t.dataset.editField) { state.editing = { id: t.dataset.editField, field: t.dataset.field }; render(); const el = view.querySelector('[data-edit-input]'); el?.focus(); el?.setSelectionRange(el.value.length, el.value.length); }
    else if (t.dataset.saveField) await saveField(t.dataset.saveField, t.dataset.field);
    else if ('cancelField' in t.dataset) { state.editing = null; render(); }
    else if (t.dataset.tt) openTT(t.dataset.tt);
    else if (t.dataset.lb) openLightbox(t.dataset.lb, +t.dataset.i);
    else if (t.dataset.hlb) { const h = hookById(t.dataset.hlb); openLb([h.thumb], 0, 'Slide 1 of the original post: ' + h.text, () => `Original post · ${h.evidence || h.category}`); }
    else if (t.dataset.addIdea) await addHookToIdeas(t.dataset.addIdea);
    else if (t.dataset.checkViews) {
      const p = state.posts.find(x => x.id === t.dataset.checkViews); const ch = chanOf(p);
      const pinged = pingClaude(t, `Overture engine request: check views of ${p.ref} (post ${p.id}) on the ${ch?.name || p.schedule?.channel || 'TikTok'} channel${ch?.handle ? ' (' + ch.handle + ')' : ''}. Follow the Overture processing-runbook.md (Check views).`);
      await patchPost(p.id, { stats: { ...(p.stats || {}), status: 'queued', requestedAt: new Date().toISOString(), error: null } });
      toast((await pinged) ? 'Queued: Claude will check the views' : 'Queued. Claude was not notified automatically, so tell Claude "views ' + p.ref + '"');
    }
    else if (t.dataset.posted) { await patchPost(t.dataset.posted, { stage: 'posted', postedAt: new Date().toISOString() }); toast('Moved to Posted'); }
    else if (t.dataset.unpost) { await patchPost(t.dataset.unpost, { stage: 'scheduled', postedAt: null }); toast('Moved back to Scheduled'); }
    else if (t.dataset.createCaption) {
      const p = state.posts.find(x => x.id === t.dataset.createCaption);
      const pinged = pingClaude(t, `Overture engine request: create the caption and TikTok title of ${p.ref} (post ${p.id}). It has none yet. Follow the Overture processing-runbook.md (Reimagine caption rules). Keep any headline or title I edited (locked.cover / locked.title) exactly as saved.`);
      await patchPost(p.id, { reimagine: { ...(p.reimagine || {}), caption: { status: 'queued', requestedAt: new Date().toISOString(), create: true } } });
      toast((await pinged) ? 'Queued: Claude will write the caption and title' : 'Queued. Claude was not notified automatically, so tell Claude "caption ' + p.ref + '"');
    }
    else if (t.dataset.reimagine) {
      // Queued for Claude: slides get a new composition (same original look), captions a new angle or viewpoint
      const p = state.posts.find(x => x.id === t.dataset.id); const kind = t.dataset.reimagine;
      const pinged = pingClaude(t, `Overture engine request: reimagine the ${kind} of ${p.ref} (post ${p.id}). Follow the Overture processing-runbook.md.${kind === 'caption' ? ' Keep any headline or title I edited (locked.cover / locked.title) exactly as saved.' : ''}`);
      await patchPost(p.id, { reimagine: { ...(p.reimagine || {}), [kind]: { status: 'queued', requestedAt: new Date().toISOString() } } });
      if (!(await pinged)) toast('Queued. Claude was not notified automatically, so tell Claude "reimagine ' + p.ref + '"');
      toast(kind === 'slides' ? 'Queued: Claude will reimagine the slides' : 'Queued: Claude will reimagine the caption');
    }
    else if (t.dataset.reject) {
      // Two clicks: the first arms the button, the second sends the post back to the hook library
      const id = t.dataset.reject;
      if (state.rejectArm !== id) { state.rejectArm = id; render(); view.querySelector(`[data-reject="${CSS.escape(id)}"]`)?.focus(); clearTimeout(state.rejectT); state.rejectT = setTimeout(() => { if (state.rejectArm === id) { state.rejectArm = null; render(); } }, 5000); return; }
      state.rejectArm = null; await rejectPost(id);
    }
    else if (t.dataset.approve1) { await patchPost(t.dataset.approve1, { stage: 'review', approvedAt: new Date().toISOString() }); toast('Moved to Review'); }
    else if (t.dataset.back) { await patchPost(t.dataset.back, { stage: 'idea' }); toast('Moved back to Ideas'); }
    else if (t.dataset.retry) { const p = state.posts.find(x => x.id === t.dataset.retry); const now = new Date().toISOString(); await patchPost(p.id, { schedule: { ...p.schedule, status: 'processing', step: 'queued', error: null, detail: null, queuedAt: now, updatedAt: now } }); toast('Queued again'); }
    else if (t.dataset.unqueue) {
      // Already sent to Postiz: the page can't delete it there, so remind the operator to avoid a duplicate
      const sent = state.posts.find(x => x.id === t.dataset.unqueue)?.schedule?.status === 'sent';
      await patchPost(t.dataset.unqueue, { stage: 'review', schedule: null });
      toast(sent ? 'Moved back to Review. Delete it in Postiz too, so it doesn\'t post twice' : 'Moved back to Review');
    }
    else if (t.dataset.addNew) await addPlanHookToLibrary(t.dataset.addNew);
    else if (t.dataset.approve2) {
      const p = state.posts.find(x => x.id === t.dataset.approve2);
      // Ping first, inside the click gesture; schedule() writes the queue entry Claude then reads
      const ch = CHANNELS.find(c => c.key === t.dataset.channel) || CHANNELS[0]; if (!ch) return;
      const pinged = pingClaude(t, `Overture engine request: Approve 2 on ${p.ref} (post ${p.id}) to the ${ch.name} channel. Process it per the Overture processing-runbook.md.`);
      const queued = await schedule(p.id, ch);
      if (queued && !(await pinged)) toast('Queued. Claude was not notified automatically, so tell Claude "approved ' + p.ref + '"');
    }
  });

  // ── Writes ───────────────────────────────────────────────────────────
  async function patchPost(id, patch) {
    if (!db) return;
    try { await db.doc('posts/' + id).update(patch); }
    catch (e) { if (e?.code === 'invalid_argument') { state.canWrite = false; setStatus('You can view this page but not change it. Ask the owner for Contributor access.', 'warn'); render(); } else toast('Could not save: ' + (e?.message || e?.code)); }
  }

  const nextHookNum = () => state.hooks.reduce((m, h) => Math.max(m, h.num || 0), 0) + 1;

  async function saveNewHook() {
    const text = $('#nh-text').value.trim(); if (!text) return;
    let category = $('#nh-cat').value; if (category === '__new') category = $('#nh-newcat').value.trim() || 'Other';
    const doc = { category, text, status: $('#nh-status').value, source: 'Added in engine', sourceHook: $('#nh-source').value.trim() || null,
      evidence: $('#nh-evidence').value.trim(), note: $('#nh-note').value.trim(), basedOn: null, order: Date.now(), createdAt: new Date().toISOString() };
    const slug = 'u-' + Date.now().toString(36);
    const num = nextHookNum(); Object.assign(doc, { num, ref: 'H-' + String(num).padStart(3, '0') });
    try { await db.doc('hooks/' + slug).set({ id: slug, ...doc }); state.adding = false; state.cat = 'All'; state.q = ''; toast('Hook saved'); }
    catch (e) { toast(e?.code === 'quota_exceeded' ? 'The library is full (5,000 items). Remove some hooks first.' : 'Could not save the hook: ' + (e?.message || e?.code)); }
  }

  async function addPlanHookToLibrary(postId) {
    const p = state.posts.find(x => x.id === postId); if (!p?.newHook) return;
    const id = (p.newHook.planId || 'plan') + '-' + postId.slice(5);
    try {
      const num = nextHookNum();
      await db.doc('hooks/' + id).set({ id, num, ref: 'H-' + String(num).padStart(3, '0'), category: catOf(p), text: p.newHook.text, status: 'test-first', source: 'Week plan', sourceHook: null,
        evidence: '', note: [p.subject, p.notes].filter(Boolean).join(' · '), basedOn: p.newHook.basedOn || null, order: Date.now(), createdAt: new Date().toISOString() });
      await db.doc('posts/' + postId).update({ hookId: id, newHook: null });
      toast('Added to the hook library');
    } catch (e) { toast('Could not add: ' + (e?.message || e?.code)); }
  }

  // Reject: remove the post from the week plan. A new hook not yet in the library is added first, so it isn't lost.
  async function rejectPost(postId) {
    const p = state.posts.find(x => x.id === postId); if (!p || !db) return;
    state.busy[postId] = true; render();
    try {
      if (!(p.hookId && hookById(p.hookId)) && p.newHook?.text) {
        const id = (p.newHook.planId || 'plan') + '-' + postId.slice(5);
        const num = nextHookNum();
        await db.doc('hooks/' + id).set({ id, num, ref: 'H-' + String(num).padStart(3, '0'), category: catOf(p), text: p.newHook.text, status: 'test-first', source: 'Week plan (rejected post)', sourceHook: null,
          evidence: '', note: [p.subject, p.notes].filter(Boolean).join(' · '), basedOn: p.newHook.basedOn || null, order: Date.now(), createdAt: new Date().toISOString() });
      }
      await db.doc('posts/' + postId).delete();
      toast(`${p.ref || 'Post'} rejected: removed from the plan, hook kept in the library`);
    } catch (e) {
      if (e?.code === 'invalid_argument' || e?.code === 'permission_denied') { state.canWrite = false; setStatus('You can view this page but not change it. Ask the owner for Contributor access.', 'warn'); }
      else toast('Could not reject: ' + (e?.message || e?.code));
    } finally { delete state.busy[postId]; render(); }
  }

  // Approve 2 queues the post for processing on the operator's machine (Claude runs it): the text-free photos
  // go through Telegram to be compressed, come back, are uploaded to Postiz, then the post is scheduled there.
  // Claude writes each step to schedule.step so the Scheduled tab shows live progress.
  const STEPS = [
    ['queued', 'Queued for processing'],
    ['telegram', 'Sending text-free photos to Telegram to compress'],
    ['download', 'Downloading the compressed photos'],
    ['upload', 'Uploading photos to Postiz'],
    ['schedule', 'Scheduling the post in Postiz']
  ];

  async function schedule(id, ch = CHANNELS[0]) {
    const p = state.posts.find(x => x.id === id); if (!p || !ch) return;
    const input = view.querySelector(`[data-edit-when="${CSS.escape(id)}"]`);
    const local = input?.value || p.scheduleAt || `${p.date}T${p.time}`;
    const at = new Date(local);
    if (isNaN(at) || at.getTime() < Date.now() + 60000) { await patchPost(id, { lastError: 'Pick a send time at least a minute in the future.' }); return; }
    const caption = view.querySelector(`[data-edit-caption="${CSS.escape(id)}"]`)?.value ?? p.caption;
    const title = view.querySelector(`[data-edit-title="${CSS.escape(id)}"]`)?.value.trim() ?? p.title;
    const now = new Date().toISOString();
    await patchPost(id, { caption, title, scheduleAt: local, stage: 'scheduled', lastError: null,
      schedule: { destination: 'postiz', channel: ch.name, integrationId: ch.id, at: at.toISOString(), status: 'processing', step: 'queued', queuedAt: now, updatedAt: now } });
    toast('Processing: Telegram compression, then Postiz');
    return true;
  }

  function progress(s) {
    if (s.status === 'sent') return `<div class="result good">Scheduled in Postiz${s.channel ? ` · ${esc(s.channel)}` : ''}${s.previewUrl ? ` · <a href="${esc(s.previewUrl)}" target="_blank" rel="noopener">open</a>` : ''}</div>`;
    const cur = Math.max(0, STEPS.findIndex(([k]) => k === s.step));
    const failed = s.status === 'error';
    return `<ol class="steps" aria-label="Processing progress">${STEPS.map(([k, label], i) => {
      const st = i < cur ? 'done' : i === cur ? (failed ? 'fail' : 'now') : 'todo';
      return `<li class="${st}"><span class="dot" aria-hidden="true">${st === 'done' ? '✓' : st === 'fail' ? '!' : ''}</span>${esc(label)}${st === 'now' && s.detail ? ` <span class="k">· ${esc(s.detail)}</span>` : ''}</li>`;
    }).join('')}</ol>
    ${failed ? `<div class="result bad">${esc(s.error || 'Processing failed')}</div><button class="btn link" type="button" data-retry="${esc(s._id)}">Try again</button>`
      : s.step === 'queued' ? `<div class="k" style="font-size:12px">Claude has been notified and will start shortly. If nothing moves within a few minutes, tell Claude "approved" and the post number.</div>` : ''}`;
  }

  // ── TikTok preview ───────────────────────────────────────────────
  // Photo-mode post in a 9:16 frame: slide on top, handle + title + caption below, tap sides to swipe
  const ICON = {
    heart: '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2 0 3.6 1.1 4.4 2.6.8-1.5 2.4-2.6 4.4-2.6 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>',
    chat: '<svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.7 2 11.3c0 2.6 1.4 4.9 3.7 6.4L5 21l4-2.1c1 .3 2 .4 3 .4 5.5 0 10-3.7 10-8.3S17.5 3 12 3z"/></svg>',
    save: '<svg viewBox="0 0 24 24"><path d="M6 2h12a1 1 0 0 1 1 1v19l-7-4.5L5 22V3a1 1 0 0 1 1-1z"/></svg>',
    share: '<svg viewBox="0 0 24 24"><path d="M13 4v4C6 9 3 14 3 20c2.5-3.5 6-5 10-5v4l8-7.5L13 4z"/></svg>'
  };
  const tt = { id: null, i: 0, open: false };
  const ttSlides = () => state.posts.find(x => x.id === tt.id)?.slides || [];
  function openTT(id) { tt.id = id; tt.i = 0; tt.open = false; renderTT(); $('#tt').hidden = false; $('#tt-close')?.focus(); }
  function closeTT() { $('#tt').hidden = true; tt.id = null; }
  function stepTT(d) { tt.i = Math.max(0, Math.min(ttSlides().length - 1, tt.i + d)); renderTT(); }
  function renderTT() {
    const p = state.posts.find(x => x.id === tt.id); if (!p) return closeTT();
    const slides = p.slides || [], n = slides.length, i = Math.min(tt.i, Math.max(0, n - 1));
    // TikTok shows the title on its own line, so drop it from the start of the caption
    let cap = (p.caption || '').trim();
    const first = cap.split('\n')[0].trim();
    if (p.title && first.replace(/\.+$/, '') === p.title.trim().replace(/\.+$/, '')) cap = cap.slice(cap.indexOf('\n') + 1).trim();
    $('#tt').innerHTML = `<div class="tt-col">
      <div class="tt-phone">
        <div class="tt-top"><span>Following</span><b>For You</b></div>
        <div class="tt-media">${n ? slideImg(p, i, `Slide ${i + 1} of ${n}`) : ''}
          ${n > 1 ? `<span class="tt-count">${i + 1}/${n}</span>
          <button type="button" class="tt-nav prev" data-tt-go="-1" aria-label="Previous slide"></button><button type="button" class="tt-nav next" data-tt-go="1" aria-label="Next slide"></button>
          <div class="tt-dots">${slides.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>` : ''}</div>
        <div class="tt-rail"><div class="tt-avatar" style="background-image:url('${esc(slides[0] || '')}')"></div>
          <span>${ICON.heart}0</span><span>${ICON.chat}0</span><span>${ICON.save}0</span><span>${ICON.share}Share</span></div>
        <div class="tt-info">
          <div class="tt-user">${esc(HANDLE)}</div>
          ${p.title ? `<div class="tt-title">${esc(p.title)}</div>` : ''}
          <div class="tt-cap ${tt.open ? 'open' : ''}">${esc(cap)}</div>
          ${cap ? `<button type="button" class="tt-more" data-tt-more>${tt.open ? 'less' : 'more'}</button>` : ''}
          <div class="tt-sound">♫ Add a sound in the TikTok app before publishing</div>
        </div>
        <div class="tt-bar"><span>Home</span><span>Friends</span><span class="plus">+</span><span>Inbox</span><span>Profile</span></div>
      </div>
      <div class="tt-controls"><button type="button" data-tt-go="-1" ${i === 0 ? 'disabled' : ''}>← Prev</button><span>${esc(p.ref || '')} · slide ${i + 1} of ${n}</span><button type="button" data-tt-go="1" ${i >= n - 1 ? 'disabled' : ''}>Next →</button><button type="button" id="tt-close">Close</button></div>
    </div>`;
  }
  $('#tt').addEventListener('click', e => {
    if (e.target.id === 'tt' || e.target.id === 'tt-close') return closeTT();
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.ttGo) stepTT(+b.dataset.ttGo);
    else if ('ttMore' in b.dataset) { tt.open = !tt.open; renderTT(); }
  });
  document.addEventListener('keydown', e => {
    if ($('#tt').hidden) return;
    if (e.key === 'Escape') closeTT(); else if (e.key === 'ArrowLeft') stepTT(-1); else if (e.key === 'ArrowRight') stepTT(1);
  });

  // ── Lightbox ─────────────────────────────────────────────────────────
  // One viewer for post slides and hook images: items = [src], alt, label(i)
  const lb = { items: [], alt: '', label: () => '', i: 0 };
  function openLb(items, i, alt, label, post) { Object.assign(lb, { items, i, alt, label, post: post || null }); showLb(); $('#lightbox').hidden = false; $('#lb-close').focus(); }
  function openLightbox(postId, i) {
    const p = state.posts.find(x => x.id === postId);
    openLb(p.slides, i, p.cover, n => `${fmtDay(p.date)} ${p.time} · slide ${n + 1} of ${p.slides.length}`, p);
  }
  function showLb() {
    $('#lb-media').innerHTML = lb.post ? `<div class="lb-frame">${slideImg(lb.post, lb.i, lb.alt)}</div>` : `<img src="${esc(lb.items[lb.i])}" alt="${esc(lb.alt)}">`; $('#lb-label').textContent = lb.label(lb.i); $('#lb-prev').disabled = lb.i === 0; $('#lb-next').disabled = lb.i === lb.items.length - 1; $('#lb-prev').hidden = $('#lb-next').hidden = lb.items.length < 2; }
  function closeLb() { $('#lightbox').hidden = true; }
  $('#lb-close').onclick = closeLb;
  $('#lb-prev').onclick = () => { if (lb.i > 0) { lb.i--; showLb(); } };
  $('#lb-next').onclick = () => { if (lb.i < lb.items.length - 1) { lb.i++; showLb(); } };
  $('#lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLb(); });
  document.addEventListener('keydown', e => {
    if ($('#lightbox').hidden) return;
    if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') $('#lb-prev').click(); else if (e.key === 'ArrowRight') $('#lb-next').click();
  });

  // ── Boot ─────────────────────────────────────────────────────────────
  render();
  (async () => {
    const claude = window.claude;
    if (!claude?.use) { setStatus('Open this page in claude.ai to load the hook library and week plan.', 'warn'); return; }
    db = await claude.use('db');
    if (!db) { setStatus('The shared library could not load in this view. Open the page in claude.ai.', 'warn'); return; }
    claude.use('comments').then(c => { comments = c; });
    claude.use('user').then(async u => { const w = await u?.can?.('data.write'); if (w === false) { state.canWrite = false; setStatus('View only: ask the owner for Contributor access to approve or add hooks.', 'warn'); render(); } });
    let loaded = 0;
    const done = () => { if (++loaded === 2) setStatus(''); };
    db.collection('hooks').onSnapshot(s => { state.hooks = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); done(); },
      e => setStatus('The hook library stopped updating (' + e.code + '). Reload the page.', 'bad'));
    db.collection('posts').onSnapshot(s => { state.posts = s.docs.map(d => ({ id: d.id, ...d.data() })); render(); done(); },
      e => setStatus('The week plan stopped updating (' + e.code + '). Reload the page.', 'bad'));
  })();
})();
</script>
